# RSS feed sources for the daily-draft pipeline.
#
# Each source produces candidate items that scripts/draft_from_rss.py
# turns into Korean-language drafts for human review.
#
# Fields:
#   name      : Human-readable label (used in source attribution).
#   url       : RSS / Atom feed URL.
#   category  : One of the content-collection categories defined in
#               src/content.config.ts CATEGORIES. The generated draft's
#               frontmatter `category` defaults to this value.
#               (immigration | tax | health | education | retirement |
#                community | economy | ai | robotics | real-estate)
#   enabled   : Set to false to skip without deleting the entry.
#   max_items : Optional. Cap items pulled from this feed per run. Default 3.
#
# ─────────────────────────────────────────────────────────────────────────
# 2026-05-20 audit: the legacy USCIS / IRS / Treasury / SSA feeds were all
# verified DEAD — USCIS feed/59 returns zero <item> elements; IRS has no RSS
# in 2026; the Treasury feed 404s; SSA 403s automated access. They are
# replaced by the Federal Register API, the authoritative source for actual
# immigration + tax + Social Security regulatory action. Tested live (71
# items for combined DHS + IRS rules). No API key required.
# ─────────────────────────────────────────────────────────────────────────

sources:
  # ── Tier 1: Federal Register API — regulatory action (RULE + PRORULE) ──
  # Real fee changes, benefit rules, policy shifts. High signal, no NOTICE noise.
  - name: Federal Register — Immigration Rules
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=u-s-citizenship-and-immigration-services&conditions%5Btype%5D%5B%5D=RULE&conditions%5Btype%5D%5B%5D=PRORULE&order=newest
    category: immigration
    enabled: true
    max_items: 3

  # Google News backup catches high-impact USCIS policy memos / alerts that do
  # not appear as Federal Register RULE/PRORULE items. Validated 2026-05-22 via
  # feedparser (100 entries). Keep max_items low; urgent keyword priority in
  # draft_from_rss.py decides what deserves Claude time.
  - name: Google News — USCIS / Green Card Watch
    url: https://news.google.com/rss/search?q=USCIS%20green%20card%20OR%20I-485%20OR%20adjustment%20of%20status&hl=en-US&gl=US&ceid=US:en
    category: immigration
    enabled: true
    max_items: 4

  - name: Federal Register — Tax Rules (IRS)
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=internal-revenue-service&conditions%5Btype%5D%5B%5D=RULE&conditions%5Btype%5D%5B%5D=PRORULE&order=newest
    category: tax
    enabled: true
    max_items: 3

  # Backup for IRS guidance / tax deadline stories that are not formal rules.
  # Validated 2026-05-22 via feedparser (100 entries).
  - name: Google News — IRS / Tax Guidance Watch
    url: https://news.google.com/rss/search?q=IRS%20tax%20guidance%20OR%20tax%20deadline&hl=en-US&gl=US&ceid=US:en
    category: tax
    enabled: true
    max_items: 3

  - name: Federal Register — Social Security Rules
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=social-security-administration&conditions%5Btype%5D%5B%5D=RULE&conditions%5Btype%5D%5B%5D=PRORULE&order=newest
    category: retirement
    enabled: true
    max_items: 2

  # ── Tier 1: still-working agency feeds ──
  - name: State Department Travel Advisories
    url: https://travel.state.gov/_res/rss/TAsTWs.xml
    category: community
    enabled: true
    max_items: 2

  - name: CDC Newsroom
    url: https://tools.cdc.gov/api/v2/resources/media/132608.rss
    category: health
    enabled: true
    max_items: 2

  - name: FDA Press Announcements
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
    category: health
    enabled: true
    max_items: 2

  # Backup for recalls / Medicare / urgent public-health stories. Validated
  # 2026-05-22 via feedparser (71 entries). Kept narrow + low-volume.
  - name: Google News — Health Policy / Recall Watch
    url: https://news.google.com/rss/search?q=FDA%20recall%20OR%20CDC%20Medicare%20health&hl=en-US&gl=US&ceid=US:en
    category: health
    enabled: true
    max_items: 3

  - name: CMS Newsroom (Medicare / Medicaid / ACA)
    url: https://www.cms.gov/newsroom/rss-feeds
    category: health
    enabled: false  # disabled: this is an HTML feed listing page, not RSS; caused <a href> slugs
    max_items: 2

  # GSC-backed focus expansion (2026-05-29): keep these as primary service
  # lanes alongside immigration/tax/retirement. They feed insurance + housing
  # explainers for Korean-American families without dropping economy/AI/robotics.
  - name: Google News — Health Insurance / Medicare Watch
    url: https://news.google.com/rss/search?q=health%20insurance%20OR%20Medicare%20premium%20OR%20ACA%20subsidy&hl=en-US&gl=US&ceid=US:en
    category: health
    enabled: true
    max_items: 3

  - name: Google News — Housing / Mortgage Watch
    url: https://news.google.com/rss/search?q=mortgage%20rates%20OR%20home%20insurance%20OR%20housing%20affordability&hl=en-US&gl=US&ceid=US:en
    category: real-estate
    enabled: true
    max_items: 3

  - name: Federal Reserve — Monetary Policy
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    category: economy
    enabled: true
    max_items: 2

  - name: BLS Latest Numbers
    url: https://www.bls.gov/feed/bls_latest.rss
    category: economy
    enabled: true
    max_items: 1

  # Backup for CPI / rate-sensitive stories. Validated 2026-05-22 via
  # feedparser (52 entries). Kept low-volume to avoid generic market noise.
  - name: Google News — CPI / Interest Rate Watch
    url: https://news.google.com/rss/search?q=CPI%20interest%20rates%20BLS%20Federal%20Reserve&hl=en-US&gl=US&ceid=US:en
    category: economy
    enabled: true
    max_items: 3

  - name: NPR Business
    url: https://feeds.npr.org/1006/rss.xml
    category: economy
    enabled: true
    max_items: 2

  # ── AI / automation — high-signal tech and policy-adjacent coverage ──
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    category: ai
    enabled: true
    max_items: 2

  - name: MIT Technology Review — AI
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed/
    category: ai
    enabled: true
    max_items: 2

  # ── Robotics / future work — credible engineering and industry coverage ──
  - name: IEEE Spectrum — Robotics
    url: https://spectrum.ieee.org/feeds/topic/robotics.rss
    category: robotics
    enabled: true
    max_items: 2

  - name: The Robot Report
    url: https://www.therobotreport.com/feed/
    category: robotics
    enabled: true
    max_items: 2

  # ── DISABLED: verified broken 2026-05-20. Do NOT re-enable without a new URL.
  - name: USCIS Newsroom            # feed/59 returns ZERO <item> elements — dead
    url: https://www.uscis.gov/news/rss-feed/59
    category: immigration
    enabled: false
    max_items: 3
  - name: IRS Newsroom              # no working RSS in 2026 — use Federal Register
    url: https://www.irs.gov/newsroom
    category: tax
    enabled: false
    max_items: 3
  - name: U.S. Treasury Press       # feed URL now 404s
    url: https://home.treasury.gov/news/press-releases/feed
    category: economy
    enabled: false
    max_items: 3
  - name: SSA Press Releases        # 403s automated access — use Federal Register
    url: https://www.ssa.gov/news/press/releases/
    category: retirement
    enabled: false
    max_items: 2
  - name: USCIS Newsroom All News   # 0 entries / bozo on 2026-05-22; use Google News watch + Federal Register
    url: https://www.uscis.gov/newsroom/all-news/feed
    category: immigration
    enabled: false
    max_items: 2
  - name: USCIS Alerts              # 0 entries / bozo on 2026-05-22; no reliable RSS found
    url: https://www.uscis.gov/news/alerts/feed
    category: immigration
    enabled: false
    max_items: 2
  - name: AP Immigration            # 0 entries / bozo on 2026-05-22 from public RSS URL
    url: https://apnews.com/hub/immigration/rss
    category: immigration
    enabled: false
    max_items: 2
  - name: Politico Immigration      # 0 entries / bozo on 2026-05-22 from public RSS URL
    url: https://www.politico.com/rss/immigration.xml
    category: immigration
    enabled: false
    max_items: 2
  - name: HHS News Releases         # 0 entries / bozo on 2026-05-22 from public RSS URL
    url: https://www.hhs.gov/about/news/news-releases/rss.xml
    category: health
    enabled: false
    max_items: 2
  - name: BEA News                  # 0 entries / bozo on 2026-05-22 from public RSS URL
    url: https://www.bea.gov/news/rss.xml
    category: economy
    enabled: false
    max_items: 2
  - name: Korea Times US            # feed moved; low KA-family relevance
    url: https://www.koreatimes.co.kr/www/rss/world.xml
    category: community
    enabled: false
    max_items: 2
