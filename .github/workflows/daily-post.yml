name: Daily post from queue

on:
  push:
    branches:
      - main
    paths:
      - 'queue/**'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many queued posts to publish this run (default: drain queue up to 10)'
        required: false
        default: '10'

# Max posts a single run will publish, regardless of trigger. Protects against
# an accidental 50-item queue draining all at once. Tune up if you need bigger
# scheduled batches.
env:
  POSTS_PER_RUN_CAP: '10'

permissions:
  contents: write

concurrency:
  group: daily-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        # Anonymous checkout avoids intermittent GITHUB_TOKEN 403s on this
        # public repo. The publish step configures an authenticated push URL.
        run: |
          git init .
          git remote add origin https://github.com/zoelumos/migukstory.git
          git fetch --depth=2 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate queue markdown before publish
        run: python scripts/validate_markdown_frontmatter.py queue --strict-publish

      - name: Determine batch size
        id: batch
        # On push (queue/** changed via merged PR): drain the queue up to the
        # cap so we don't strand 9 freshly-merged drafts behind a count=1.
        # On workflow_dispatch: honor inputs.count, still capped.
        run: |
          cap="${POSTS_PER_RUN_CAP:-10}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            n="${{ github.event.inputs.count }}"
            [ -z "$n" ] && n="$cap"
          else
            n=$(ls -1 queue/*.md 2>/dev/null | wc -l | tr -d ' ')
            [ -z "$n" ] && n=0
          fi
          if [ "$n" -gt "$cap" ]; then n="$cap"; fi
          if [ "$n" -lt 1 ]; then n=1; fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Will publish up to $n post(s) (cap=$cap, event=${{ github.event_name }})."

      - name: Publish from queue
        env:
          POSTS_PER_RUN: ${{ steps.batch.outputs.count }}
        run: python scripts/publish_from_queue.py

      - name: Validate generated blog markdown
        run: python scripts/validate_markdown_frontmatter.py src/content/blog

      - name: Setup Node for pre-push build check
        if: steps.batch.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build before pushing publish commit
        run: |
          npm ci
          npm run build

      - name: Commit and push
        id: publish
        run: |
          git config user.email "bot@migukstory.com"
          git config user.name "Miguk Story Bot"
          git add -A src/content/blog
          if [ -d queue ]; then
            git add -A queue
          fi
          if git diff --staged --quiet; then
            echo "Nothing to commit (queue may be empty)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +"%Y-%m-%d")
          git commit -m "post: scheduled publish (${today})"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Checkout is intentionally detached to avoid intermittent checkout-token
          # failures, so push the current commit explicitly back to main.
          #
          # A sibling Daily-post run (push trigger racing with a workflow_dispatch,
          # or two rapid pushes to queue/**) can advance origin/main during this
          # run and cause our push to be rejected as non-fast-forward. Rebase
          # onto the new origin/main and retry. If the sibling already published
          # the same queue files, the rebase leaves no commits ahead of main and
          # this run becomes a no-op (downstream notify/deploy steps are
          # skipped, since the sibling already ran them).
          PUBLISHED_RESULT=""
          push_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                PUBLISHED_RESULT="true"
                return 0
              fi
              echo "Push attempt ${attempt} rejected; fetching origin/main and rebasing..."
              git fetch origin main || return 1
              if ! git rebase origin/main; then
                echo "Rebase had conflicts; aborting and checking for sibling completion."
                git rebase --abort 2>/dev/null || true
                if git diff --quiet origin/main -- src/content/blog queue; then
                  echo "Sibling run already published these files; treating as no-op."
                  PUBLISHED_RESULT="false"
                  return 0
                fi
                return 1
              fi
              if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
                echo "Rebase left no commits ahead of origin/main; sibling already merged our publish."
                PUBLISHED_RESULT="false"
                return 0
              fi
              sleep $((attempt * 2))
            done
            echo "Push still failing after retries."
            return 1
          }
          if push_with_retry; then
            echo "published=${PUBLISHED_RESULT}" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Notify search engines (IndexNow + Google Indexing API)
        # Pings indexing APIs for the just-published blog URL(s) so a new post
        # is submitted the moment it is published. This step lives here (not
        # only in cloudflare-deploy.yml / google-index.yml) because the push
        # above uses the default GITHUB_TOKEN, and GitHub deliberately does
        # NOT trigger other workflows from a GITHUB_TOKEN push — so without
        # this step a queue-published post would not be submitted until the
        # next scheduled google-index.yml run (up to ~24h later).
        #
        # Secret: GSC_SERVICE_ACCOUNT — base64-encoded Google service-account
        # JSON with the Indexing API enabled. notify_indexes.py also accepts a
        # raw-JSON GOOGLE_SERVICE_ACCOUNT_JSON. IndexNow needs no secret (it
        # reads the key file from public/<key>.txt).
        # continue-on-error: indexing is best-effort; never fail a publish.
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          SITE_URL: https://migukstory.com
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          # google-auth is a soft dependency — notify_indexes.py falls back to
          # IndexNow-only when the import fails. Install is fast (~5s).
          python3 -m pip install --quiet google-auth requests 2>&1 | tail -3 || true
          python3 scripts/notify_indexes.py --auto

      - name: Setup Node for immediate deploy
        if: steps.publish.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build site for immediate deploy
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Check Cloudflare secrets
        if: steps.publish.outputs.published == 'true'
        id: cf-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          fi

      - name: Deploy to Cloudflare Pages immediately
        if: steps.publish.outputs.published == 'true' && steps.cf-secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=migukstory --branch=main

      - name: Send newsletter for newly deployed posts
        if: steps.publish.outputs.published == 'true' && steps.cf-secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          SITE_URL: https://migukstory.com
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_BASE_SHA: HEAD^
          NEWSLETTER_HEAD_SHA: HEAD
        run: node scripts/send_newsletter_digest.mjs
