# RentCast 라이브 매물 조회 (포트리 온누리교회 프로젝트)
# GitHub 러너는 외부망 자유 → RentCast 접속 가능(우리 개발 컨테이너는 정책 차단).
# 결과 JSON을 실행 로그에 찍어, Claude가 로그를 읽어 분석한다.
#
# ⚠️ 사전 1회: 리포 Settings > Secrets and variables > Actions >
#    New repository secret 에  RENTCAST_API_KEY  등록 (값=RentCast 키).
name: RentCast Listings (Fort Lee area)

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/rentcast-fortlee.yml'
      - 'real-estate/fortlee/tools/rentcast_listings.py'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch active multi-family via RentCast
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: |
          if [ -z "$RENTCAST_API_KEY" ]; then
            echo "::error::RENTCAST_API_KEY secret 미설정 — 리포 Settings > Secrets and variables > Actions 에서 추가하세요."
            exit 1
          fi
          cd real-estate/fortlee/tools
          python3 rentcast_listings.py || true
          echo "=====RENTCAST_JSON_BEGIN====="
          cat rentcast_listings.json 2>/dev/null || echo "[]"
          echo ""
          echo "=====RENTCAST_JSON_END====="
