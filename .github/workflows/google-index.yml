name: Google Indexing

# Submits the sitemap to Search Console. On content pushes, pings only the
# newly added blog URLs through IndexNow / Google Indexing API. Runs daily +
# after content changes on main + manual trigger.
#
# Requires repo secret GSC_SERVICE_ACCOUNT (base64-encoded service account JSON).
# Create/rotate it with:
#   base64 -i .secrets/gsc-service-account.json | gh secret set GSC_SERVICE_ACCOUNT

on:
  schedule:
    - cron: '0 9 * * *'        # daily 09:00 UTC
  push:
    branches: [main]
    paths:
      - 'src/content/**'        # only when content changes
      - 'src/pages/**'
      - '.github/workflows/google-index.yml'
      - 'scripts/google_index.mjs'
      - 'scripts/notify_indexes.py'
  workflow_dispatch:            # manual "Run workflow" button

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so notify_indexes.py --auto can diff HEAD~1..HEAD and only
          # submit newly-added blog URLs instead of burning quota on the whole site.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode service account key
        run: |
          mkdir -p .secrets
          echo '${{ secrets.GSC_SERVICE_ACCOUNT }}' | base64 -d > .secrets/gsc-service-account.json
          node -e "JSON.parse(require('fs').readFileSync('.secrets/gsc-service-account.json','utf8'));console.log('key decoded OK')"

      - name: Submit sitemap to Search Console
        run: node scripts/google_index.mjs sitemap

      - name: Push newly-added blog URLs to indexing APIs
        if: github.event_name == 'push'
        # Indexing pings are best-effort. Google returns 429 when the daily
        # publish quota is exhausted; that should not mark the cron/workflow as
        # failed after the sitemap has already been submitted successfully.
        continue-on-error: true
        env:
          SITE_URL: https://migukstory.com
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          python3 -m pip install --quiet google-auth 2>&1 | tail -3 || true
          python3 scripts/notify_indexes.py --auto

      - name: Push ALL sitemap URLs to Google Indexing API
        # Manual-only full-site reindex. Scheduled/push runs are unchanged: the
        # daily cron still only submits the sitemap, and content pushes still
        # ping just the newly-added URLs. This step asks Google to (re)index
        # every URL in the sitemap and only runs from the "Run workflow" button.
        if: github.event_name == 'workflow_dispatch'
        # Best-effort, same as above: Google's Indexing API returns 429 once the
        # daily publish quota (~200 URLs) is exhausted. That must not fail the
        # workflow after the sitemap was already submitted successfully.
        continue-on-error: true
        run: node scripts/google_index.mjs push

      - name: Index-status report
        if: always()
        run: node scripts/google_index.mjs status
