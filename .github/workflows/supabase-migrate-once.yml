name: Supabase migrate once

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration SQL path to apply'
        required: true
        default: 'migrations/008_newsletter_delivery.sql'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin https://github.com/zoelumos/migukstory.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Supabase migration
        env:
          # Prefer a real Supabase Management API PAT if present. Fall back to
          # the repo's existing SUPABASE_SECRET_KEY only to test whether Steve
          # stored the management token under that older name.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PROJECT_REF: hoemvraesebfvtkkjbdx
        run: node scripts/run_migration.mjs "${{ inputs.migration }}"
