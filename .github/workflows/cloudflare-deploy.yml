name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/cloudflare-deploy.yml'
      - 'scripts/notify_indexes.py'

concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 so notify_indexes.py can diff HEAD~1..HEAD to find
          # newly-added src/content/blog/*.md files to submit for indexing.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Cloudflare secrets
        id: cf-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf-secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=migukstory --branch=main

      - name: Notify search engines (IndexNow + Google Indexing API)
        # Auto-pings indexing APIs for newly-published blog URLs. Runs only
        # after a successful deploy. IndexNow has no quota and works without
        # any secret (reads key from public/<key>.txt). The Google Indexing
        # API is only used when the service-account secret is present.
        #
        # Secret: GSC_SERVICE_ACCOUNT — base64-encoded Google service-account
        # JSON with the Indexing API enabled (same secret google-index.yml
        # uses). notify_indexes.py also accepts a raw-JSON
        # GOOGLE_SERVICE_ACCOUNT_JSON as a legacy fallback.
        # continue-on-error: indexing pings are best-effort; never fail deploys.
        if: steps.cf-secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          SITE_URL: https://migukstory.com
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          # google-auth is a soft dependency — script falls back to IndexNow only
          # when import fails. Install is fast (~5s) so always attempt it.
          python3 -m pip install --quiet google-auth requests 2>&1 | tail -3 || true
          python3 scripts/notify_indexes.py --auto
