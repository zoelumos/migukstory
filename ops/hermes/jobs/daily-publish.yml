name: migukstory-daily-publish
description: |
  Hand control to `claude -p` to orchestrate publication. Claude counts the
  posts in queue/ on origin/main and triggers daily-post.yml exactly once with
  count = min(queue_size, 10) — draining the day's freshly-merged drafts in a
  single workflow run. That run handles publish → Cloudflare deploy → indexing
  in the SAME GitHub Actions run, so a successful Hermes execution means the
  site is already updated. Emergency fallback: if Claude CLI authentication/API
  fails, trigger the same daily-post.yml workflow directly once so queued posts
  do not stall. The fallback does not edit content or touch secrets.
enabled: true
schedule: "30 12 * * *"         # 12:30 UTC = 8:30 AM ET EDT / 7:30 AM ET EST
timezone: UTC
working_dir: /Users/zoelumos/migukstory
prompt_file: prompts/daily-publish.md
log_file: logs/daily-publish-{date}.log
command: |
  set -euo pipefail
  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish starting"
  cd /Users/zoelumos/migukstory
  git fetch -q origin main

  # The orchestration prompt lives in ops/hermes/prompts/daily-publish.md.
  # The live wrapper that actually runs on cron is
  # /Users/zoelumos/.hermes/scripts/migukstory-daily-publish.sh — keep these in
  # sync if either changes.
  if claude -p "$(cat ops/hermes/prompts/daily-publish.md)" \
    --permission-mode bypassPermissions \
    --output-format text \
    --max-turns 40; then
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish done via Claude"
    exit 0
  fi

  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Claude orchestration failed; running GitHub Actions fallback"
  QUEUE_COUNT=$(git ls-tree -r --name-only origin/main queue/ | grep -E '\.md$' | wc -l | tr -d ' ')
  if [ "${QUEUE_COUNT:-0}" -lt 1 ]; then
    echo "✅ 대기열 비어 있음 — fallback publish skipped."
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish done: queue empty after Claude failure"
    exit 0
  fi
  COUNT="$QUEUE_COUNT"
  if [ "$COUNT" -gt 10 ]; then COUNT=10; fi
  echo "⚠️ Claude 실패 fallback: Daily post from queue 실행 (count=$COUNT, queue=$QUEUE_COUNT)"
  gh workflow run daily-post.yml --repo zoelumos/migukstory -f count="$COUNT"
  sleep 10
  RUN_ID=$(gh run list --repo zoelumos/migukstory --workflow daily-post.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
  RUN_URL=$(gh run view "$RUN_ID" --repo zoelumos/migukstory --json url --jq '.url')
  echo "Fallback publish run: $RUN_URL"
  gh run watch "$RUN_ID" --repo zoelumos/migukstory --exit-status
  gh run view "$RUN_ID" --repo zoelumos/migukstory --json status,conclusion,url
  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish done via fallback"
on_failure:
  notify: slack
  channel_or_recipient: "#migukstory-ops"
  message: "🔴 migukstory daily-publish cron failed — check the latest ops/hermes/logs/daily-publish-*.log"
prerequisites:
  - claude CLI authenticated with Max subscription
  - gh CLI authenticated as zoelumos with actions:write
  - Run AFTER migukstory-daily-automerge so queue/ on origin/main reflects today's draft PR
