name: migukstory-daily-publish
description: |
  Hand control to `claude -p` to orchestrate publication. Claude counts the
  posts in queue/ on origin/main and triggers daily-post.yml exactly once with
  count = min(queue_size, 10) — draining the day's freshly-merged drafts in a
  single workflow run. That run handles publish → Cloudflare deploy → indexing
  in the SAME GitHub Actions run, so a successful Hermes execution means the
  site is already updated. Steve's rule: publishing must be Claude-orchestrated,
  never raw shell.
enabled: true
schedule: "30 12 * * *"         # 12:30 UTC = 8:30 AM ET EDT / 7:30 AM ET EST
timezone: UTC
working_dir: /Users/zoelumos/migukstory
prompt_file: prompts/daily-publish.md
log_file: logs/daily-publish-{date}.log
command: |
  set -euo pipefail
  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish starting"
  cd /Users/zoelumos/migukstory
  git fetch -q origin main

  # The orchestration prompt lives in ops/hermes/prompts/daily-publish.md.
  # The live wrapper that actually runs on cron is
  # /Users/zoelumos/.hermes/scripts/migukstory-daily-publish.sh — keep these in
  # sync if either changes.
  claude -p "$(cat ops/hermes/prompts/daily-publish.md)" \
    --permission-mode bypassPermissions \
    --output-format text \
    --max-turns 40
  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish done"
on_failure:
  notify: slack
  channel_or_recipient: "#migukstory-ops"
  message: "🔴 migukstory daily-publish cron failed — check the latest ops/hermes/logs/daily-publish-*.log"
prerequisites:
  - claude CLI authenticated with Max subscription
  - gh CLI authenticated as zoelumos with actions:write
  - Run AFTER migukstory-daily-automerge so queue/ on origin/main reflects today's draft PR
