name: migukstory-daily-publish
description: |
  Trigger the GitHub Actions `daily-post.yml` workflow to publish ONE post
  from queue/ → src/content/blog/. The workflow itself handles the move,
  commit, and push. CF Pages auto-deploys on the push.
enabled: true
schedule: "0 12 * * *"          # 12:00 UTC = 8:00 AM ET EDT / 7:00 AM ET EST
timezone: UTC
working_dir: /Users/zoelumos/migukstory
prompt_file: null               # Pure shell, no Claude needed
log_file: logs/daily-publish-{date}.log
command: |
  set -euo pipefail
  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish starting"

  # 1. Trigger the workflow with count=1
  gh workflow run daily-post.yml \
    --repo zoelumos/migukstory \
    -f count=1

  echo "  workflow_dispatch sent. Waiting 90s for run to start + complete..."
  sleep 90

  # 2. Check the latest daily-post.yml run
  STATUS=$(gh run list --repo zoelumos/migukstory --workflow=daily-post.yml --limit 1 \
    --json status,conclusion,url | jq -r '.[0] | "\(.status)/\(.conclusion)|\(.url)"')
  IFS='|' read -r STATE URL <<< "$STATUS"

  case "$STATE" in
    completed/success)
      echo "  ✅ daily-post run succeeded: $URL"
      ;;
    completed/failure|completed/cancelled|completed/timed_out)
      echo "  ❌ daily-post run failed ($STATE): $URL"
      exit 1
      ;;
    in_progress/*|queued/*)
      echo "  ⏳ still running after 90s: $URL — not a failure, will resolve itself"
      ;;
    *)
      echo "  ⚠️ unknown state: $STATE — $URL"
      exit 1
      ;;
  esac
  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-publish done"
on_failure:
  notify: slack
  channel_or_recipient: "#migukstory-ops"
  message: "🔴 migukstory daily-publish cron failed — check the latest ops/hermes/logs/daily-publish-*.log"
prerequisites:
  - gh CLI authenticated as zoelumos with actions:write
  - jq installed (pre-installed on macOS 12+)
