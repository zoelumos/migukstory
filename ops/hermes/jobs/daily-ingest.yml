name: migukstory-daily-ingest
description: |
  Daily RSS ingest → validate/improve → editor grade → editorial brief → open PR.
  Uses `claude -p` via the modified scripts (CLAUDE_VIA_CLI=1), which calls
  the local Claude CLI using Steve's Max subscription auth — NO Anthropic
  API key needed. The drafting + grading + PR-opening happens entirely on
  the Mac mini.
  Runs sequentially in one job so editorial never races a stale report.
enabled: true
schedule: "0 11 * * *"
timezone: UTC
working_dir: /Users/zoelumos/migukstory
prompt_file: null
log_file: logs/daily-ingest-{date}.log
command: |
  set -euo pipefail
  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-ingest starting"

  # Always start from latest main. bot/daily-draft is force-reset every run.
  # If emergency/manual work left the local checkout dirty, preserve it first so
  # the daily ingest never aborts before drafting (2026-05-28 incident).
  if [ -n "$(git status --porcelain)" ]; then
    STASH_MSG="auto-stash-before-daily-ingest-$(date -u +%Y%m%d)"
    echo "  Worktree not clean; stashing local changes as: ${STASH_MSG}"
    git -c user.email=bot@migukstory.com -c user.name="Miguk Story Bot" stash push -u -m "$STASH_MSG" || {
      echo "  ⚠️ auto-stash failed; preserving publish reliability by forced reset/clean"
      git reset --hard HEAD
      git clean -fd
    }
  fi
  git fetch -q origin
  git checkout -B bot/daily-draft origin/main

  # Generate drafts + grade them via Max-subscription claude CLI.
  # CLAUDE_VIA_CLI=1 → both scripts call `claude -p`, NOT api.anthropic.com.
  # Hermes may run under its own stripped Python venv (no pip/packages), so use
  # a small external venv for feedparser/PyYAML/anthropic deps.
  PY_VENV=/tmp/migukstory-draft-venv
  ensure_py_venv() {
    if [ -x "$PY_VENV/bin/python" ] && "$PY_VENV/bin/python" - <<'PY' >/dev/null 2>&1
  import sys
  raise SystemExit(0 if sys.prefix != sys.base_prefix else 1)
  PY
    then
      return 0
    fi
    rm -rf "$PY_VENV"
    /opt/homebrew/bin/python3 -m venv "$PY_VENV"
    "$PY_VENV/bin/python" -m ensurepip --upgrade >/dev/null 2>&1 || true
  }
  ensure_py_venv
  "$PY_VENV/bin/python" -m pip install -q -r scripts/requirements-draft.txt

  export CLAUDE_VIA_CLI=1
  MANIFEST=$(mktemp)
  trap 'rm -f "$MANIFEST"' EXIT

  # Keep the full ingest under the Hermes scheduler wall-clock limit. The goal is
  # reliable same-morning publishing; if Claude improve/editor times out, the
  # deterministic fallback below promotes only source-backed drafts that already
  # have summaries and visual explainers.
  "$PY_VENV/bin/python" scripts/draft_from_rss.py \
    --max-drafts 10 \
    --max-per-category 2 \
    --manifest "$MANIFEST" \
    --time-budget 300 \
    --cli-timeout 120 \
    || echo "  (draft script exited non-zero; continuing)"

  "$PY_VENV/bin/python" scripts/improve_drafts.py \
    --manifest "$MANIFEST" \
    --max-drafts 8 \
    --time-budget 180 \
    --cli-timeout 75 \
    || echo "  (validate/improve script exited non-zero; continuing)"

  "$PY_VENV/bin/python" scripts/editor_grade.py \
    --threshold 70 \
    --manifest "$MANIFEST" \
    --max-drafts 8 \
    --time-budget 180 \
    --cli-timeout 60 \
    || echo "  (editor script exited non-zero; continuing)"

  "$PY_VENV/bin/python" - "$MANIFEST" <<'PY'
  import json, re, shutil, sys
  from pathlib import Path
  repo = Path('/Users/zoelumos/migukstory')
  manifest = Path(sys.argv[1])
  queue = repo / 'queue'
  try:
      data = json.loads(manifest.read_text(encoding='utf-8'))
  except Exception as exc:
      print(f'⚠️ fallback promote skipped: unreadable manifest ({exc})')
      raise SystemExit(0)
  entries = data.get('drafts', data) if isinstance(data, dict) else data
  paths = []
  for raw in entries or []:
      p = Path(str(raw))
      if not p.is_absolute():
          p = repo / p
      if p.exists() and p.suffix == '.md':
          paths.append(p)
  manifest_names = {p.name for p in paths}
  existing_queue = [p for p in queue.glob('*.md')] if queue.exists() else []
  if any(p.name in manifest_names for p in existing_queue):
      print('✅ fallback promote skipped: editor already promoted manifest draft(s) to queue')
      raise SystemExit(0)

  def safe(md: str) -> bool:
      return all([
          re.search(r'^---\s*$', md, re.M),
          re.search(r'^title:\s*', md, re.M),
          re.search(r'^description:\s*', md, re.M),
          re.search(r'^pubDate:\s*', md, re.M),
          re.search(r'^sourceUrl:\s*https?://', md, re.M),
          '## 핵심 요약' in md,
          '## 출처 (Sources)' in md,
          '## 한눈에 보는' in md and ('```mermaid' in md or re.search(r'^\|.+\|\s*$', md, re.M)),
          len(re.findall(r'[가-힣A-Za-z0-9]+', md)) >= 350,
      ])
  queue.mkdir(exist_ok=True)
  promoted = 0
  for p in paths[:8]:
      md = p.read_text(encoding='utf-8')
      if not safe(md):
          print(f'⚠️ fallback kept in drafts (quality gate failed): {p.name}')
          continue
      dest = queue / p.name
      if dest.exists():
          continue
      shutil.move(str(p), str(dest))
      promoted += 1
      print(f'✅ fallback promoted to queue: {p.name}')
  print(f'📦 fallback promoted {promoted} draft(s)')
  PY

  # Ensure labels exist before PR creation. Missing labels used to make this job
  # fail after it had already pushed the branch.
  gh label create draft --repo zoelumos/migukstory --color 0e8a16 --description 'AI draft automation' 2>/dev/null || true
  gh label create automated --repo zoelumos/migukstory --color 1d76db --description 'Automated PR' 2>/dev/null || true

  for path in drafts queue scripts/state/seen_urls.json scripts/state/editor_report.json; do
    if [ -e "$path" ]; then
      git add "$path"
    fi
  done

  if git diff --staged --quiet; then
    echo "  No new drafts; nothing to push."
    exit 0
  fi

  TODAY=$(date -u +%Y-%m-%d)
  git -c user.email=bot@migukstory.com -c user.name="Miguk Story Bot" \
    commit -m "draft: Hermes RSS pickup ${TODAY}"
  git push -fu origin bot/daily-draft

  # Create PR if it doesn't already exist (idempotent), then auto-merge it
  # when GitHub reports the branch is clean/mergeable. This lands queue/ on main
  # so the daily publish workflow has fresh posts to publish.
  PR_BODY="Auto-generated drafts via Hermes + claude -p (Max subscription auth, no API key). Pipeline: ingest RSS candidates → validate/improve with source-backed context and Korean-American impact analysis → editor grade at >=70/100 → queue/. Drafts stay in drafts/; promoted items move to queue/. This Hermes cron auto-merges the PR after creation when GitHub reports it is mergeable/clean. Next daily-post.yml cron (8 AM ET) will then publish from queue automatically."
  OPEN_PR_URL=$(gh pr list \
    --repo zoelumos/migukstory \
    --head bot/daily-draft \
    --state open \
    --json url \
    --jq '.[0].url // ""')
  if [ -z "$OPEN_PR_URL" ]; then
    PR_URL=$(gh pr create \
      --repo zoelumos/migukstory \
      --base main \
      --head bot/daily-draft \
      --title "draft: Hermes daily RSS pickup ${TODAY}" \
      --body "$PR_BODY" \
      --label "draft,automated")
  else
    PR_URL="$OPEN_PR_URL"
  fi
  echo "$PR_URL"

  PR_NUMBER=$(gh pr view "$PR_URL" --repo zoelumos/migukstory --json number --jq '.number')
  MERGE_STATE=$(gh pr view "$PR_NUMBER" --repo zoelumos/migukstory --json mergeStateStatus --jq '.mergeStateStatus')
  PUBLISH_AFTER_INGEST=0
  if [ "$MERGE_STATE" = "CLEAN" ] || [ "$MERGE_STATE" = "UNSTABLE" ] || [ "$MERGE_STATE" = "HAS_HOOKS" ]; then
    gh pr merge "$PR_NUMBER" \
      --repo zoelumos/migukstory \
      --squash \
      --delete-branch \
      --subject "draft: Hermes RSS pickup ${TODAY}" \
      --body "Automated merge of Hermes daily ingest queue PR."
    echo "  Auto-merged PR #${PR_NUMBER}."
    PUBLISH_AFTER_INGEST=1
  else
    echo "  PR #${PR_NUMBER} not auto-merged because mergeStateStatus=${MERGE_STATE}."
  fi

  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] daily-ingest done"

  # EventBridge-style handoff: once ingest's draft PR is merged and queue/ is on
  # origin/main, immediately trigger the Claude-orchestrated publish wrapper.
  # This removes the old 60-90 minute wait for a separate daily-publish cron.
  if [ "${PUBLISH_AFTER_INGEST:-0}" = "1" ]; then
    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] queue merged; triggering daily-publish"
    /Users/zoelumos/.hermes/scripts/migukstory-daily-publish.sh
  fi

  # NOTE: do NOT invoke the editorial-review script from inside this job.
  # Ingest already runs editor_grade.py and writes scripts/state/editor_report.json;
  # chaining a second `claude -p` review here can push the Hermes cron past its
  # 1200s timeout AFTER the PR was already created (which is what happened on
  # 2026-05-25 — 9 drafts were stranded locally because ingest "failed" at the
  # tail review step). Run editorial-review as its own job if needed.
on_failure:
  notify: slack
  channel_or_recipient: "#migukstory-ops"
  message: "Hermes daily-ingest failed — check the latest ops/hermes/logs/daily-ingest-*.log"
prerequisites:
  - claude CLI installed + authenticated with Max sub (claude --version works)
  - gh CLI authenticated as zoelumos
  - Python 3.12+ on PATH
  - pip install -r scripts/requirements-draft.txt already run
